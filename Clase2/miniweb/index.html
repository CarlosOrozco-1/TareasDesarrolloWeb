<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guatemala Turística</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body onload="bienvenida()" class="modo-oscuro">
  <div class="d-flex">
    <!-- Sidebar-->
    <div id="sidebar" class="bg-dark text-white p-3 d-flex flex-column justify-content-between collapsed">
      <!-- Sección Superior -->
      <div>
        <!-- Título y botón de contraer -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span id="sidebar-title" class="fw-bold fs-5">Descubre!!</span>
          <button class="btn btn-outline-light btn-sm" id="toggleSidebar" title="Contraer menú">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <!-- Botón de INICIO -->
        <div class="mb-3">
          <button class="btn btn-outline-info w-100 text-start menu-btn" onclick="mostrarInicio(this)">
            <i class="bi bi-house-fill me-2"></i><span class="sidebar-text">Inicio</span>
          </button>
        </div>

        <!-- SITIOS TURÍSTICOS (ACORDEÓN) -->

        <div class="accordion accordion-flush" id="menuAccordion">
          <div class="accordion-item bg-dark border-0">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed bg-dark text-white px-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseSitios">
                <i class="bi bi-geo-fill me-2"></i><span class="sidebar-text">Explora</span>
              </button>
            </h2>
            <div id="collapseSitios" class="accordion-collapse collapse" data-bs-parent="#menuAccordion">
              <div class="accordion-body px-2 py-1">
                <button class="btn btn-outline-success w-100 text-start mb-2 menu-btn"
                  onclick="cargarContenido('sitios/atitlan.html', this)">
                  <i class="bi bi-water me-2"></i><span class="sidebar-text">Lago Atitlán</span>
                </button>
                <button class="btn btn-outline-success w-100 text-start menu-btn"
                  onclick="cargarContenido('sitios/tikal.html', this)">
                  <i class="bi bi-tree me-2"></i><span class="sidebar-text">Tikal</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PIE DEL SIDEBAR -->

      <!-- Botón para cambiar modo-->
      <div class="modo-switch-personal">
        <div class="form-check form-switch text-white my-3">
          <input class="form-check-input" type="checkbox" id="modoSwitch" onchange="cambiarModo()" />
          <label class="form-check-label sidebar-text" for="modoSwitch">Modo claro</label>
        </div>
      </div>

      <div class="text-center small mt-3">
        <span class="sidebar-text">&copy; 2025 Guatemala Turística</span>
      </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-grow-1 p-4">
      <!-- Banner de bienvenida -->
      <div id="banner-bienvenida" class="text-center mb-4">
        <h1>Bienvenido a Guatemala Turística</h1>
        <p>Explora los sitios turísticos desde el panel lateral</p>
        <div id="video-container" class="mx-auto" style="max-width: 850px;">
          <div id="videoCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <div class="ratio ratio-16x9">
                  <iframe src="https://www.youtube.com/embed/RoQTqMyi89g" allowfullscreen></iframe>
                </div>
              </div>
              <div class="carousel-item">
                <div class="ratio ratio-16x9">
                  <!--video1-->
                  <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" allowfullscreen></iframe>
                  <!--video2-->
                  <iframe width="692" height="389" src="https://www.youtube.com/embed/7xT9ztsRaiE"
                    title="Buscando las 7 Maravillas de Guatemala - Tráiler" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                  <!--video3-->
                  <iframe width="692" height="389" src="https://www.youtube.com/embed/ODO1ZG_EBsA"
                    title="Buscando las 7 Maravillas de Guate - Quetzaltenango - Ep. 1" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
              </div>
            </div>

            <!-- Flechas de navegación -->
            <button class="carousel-control-prev" type="button" data-bs-target="#videoCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#videoCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </div>
      </div>

    </div>


    <!-- Contenido dinámico -->
    <div id="contenido">
      <p class="text-muted">
        Explora y descubre los lugares mas hermosos de nuestra bella
        Guatemala.
      </p>
    </div>
  </div>
  </div>

  <!-- Bootstrap JS y Script personalizado -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
